<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,-apple-system,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style></head><body><title>Pristrip!</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bangers&family=Comic+Neue:wght@400;700&display=swap">
<style id="css">/* Layout: comic page — wobbling Pristrip masthead, three-panel strip that unlocks panel by panel; hidden setup view behind a 10 s logo press */
:root{
  --paper:#FFD84D; --ink:#141414; --panel:#FFFFFF; --red:#E3001B; --onred:#FFFFFF; --soft:#3a3420;
  --display:'Bangers','Impact',sans-serif; --body:'Comic Neue','Comic Sans MS',cursive;
  color-scheme: light;
}
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:18px;line-height:1.5;
  background-image:radial-gradient(rgba(20,20,20,.12) 1.2px,transparent 1.3px);background-size:14px 14px}
.wrap{max-width:1240px;margin:0 auto;padding-inline:clamp(16px,4vw,40px);padding-block:clamp(24px,5vw,56px);display:flex;flex-direction:column;gap:clamp(24px,4vw,40px)}
header{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px 32px}
.logo{margin:0;font-family:var(--display);font-weight:400;font-size:clamp(60px,12vw,150px);line-height:.85;letter-spacing:3px;display:inline-flex;align-items:baseline;position:relative;transform-origin:left bottom;animation:wobble 1.8s ease-in-out infinite;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;touch-action:none;cursor:default}
.logo .k{color:var(--ink)}
.logo .r{color:var(--red)}
.logo .s2{margin-left:-.27em;position:relative}
.logo .hold{position:absolute;left:0;bottom:-12px;height:6px;width:0;background:var(--ink)}
.logo.holding .hold{width:100%;transition:width 10s linear}
.start{min-height:75vh;display:grid;place-items:center}
.start .logo{font-size:clamp(72px,18vw,220px);cursor:pointer;transform-origin:center;animation:startbob 2.4s ease-in-out infinite}
.start .logo:focus-visible{outline:4px solid var(--red);outline-offset:12px}
@keyframes startbob{0%,100%{transform:rotate(-3deg) translateY(0)}50%{transform:rotate(3deg) translateY(-14px) scale(1.04)}}
.intro{margin:0;max-width:34ch;font-size:clamp(18px,2.2vw,22px);font-weight:700;background:var(--panel);border:4px solid var(--ink);box-shadow:6px 6px 0 var(--ink);padding:12px 18px}
.strip{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:clamp(16px,2.4vw,28px)}
.panel{position:relative;margin:0;border:6px solid var(--ink);background:var(--panel);box-shadow:8px 8px 0 var(--ink);overflow:hidden;aspect-ratio:4/3;max-width:100%}
.panel img{display:block;width:100%;height:100%;object-fit:cover}
.panel.show{animation:pop .7s cubic-bezier(.2,1.6,.4,1) both}
.panel:not(.locked){cursor:pointer}
.panel.locked img,.panel.locked .head,.panel.locked .next{visibility:hidden}
.panel.locked::before{content:"?";position:absolute;inset:0;display:grid;place-items:center;font-family:var(--display);font-size:clamp(96px,12vw,160px);color:var(--ink);opacity:.2}
.panel.tapme{animation:nudge 1.4s ease-in-out infinite}
.panel.show.tapme{animation:pop .7s cubic-bezier(.2,1.6,.4,1) both,nudge 1.4s ease-in-out .7s infinite}
.num{position:absolute;left:0;top:0;padding:2px 14px;background:var(--paper);border-right:4px solid var(--ink);border-bottom:4px solid var(--ink);font-family:var(--display);font-size:30px;animation:beat 1.2s ease-in-out infinite;transform-origin:top left}
.next{position:absolute;right:0;bottom:0;padding:6px 14px;background:var(--panel);border-left:4px solid var(--ink);border-top:4px solid var(--ink);font-weight:700}
.bar{display:flex;flex-wrap:wrap;align-items:center;gap:16px}
button{font-family:var(--display);font-size:28px;letter-spacing:1px;color:var(--ink);background:var(--panel);border:4px solid var(--ink);box-shadow:5px 5px 0 var(--ink);padding:8px 22px;cursor:pointer;transition:transform .1s,box-shadow .1s}
button:hover{transform:translate(-2px,-2px);box-shadow:7px 7px 0 var(--ink)}
button:active{transform:translate(4px,4px);box-shadow:1px 1px 0 var(--ink)}
button:focus-visible,input:focus-visible{outline:4px solid var(--red);outline-offset:4px}
.head{position:absolute;left:30.5%;top:38%;width:40.5%;height:40%;border-radius:50%;background:transparent;border:0;box-shadow:none;padding:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
.head:hover,.head:focus-visible{transform:none;box-shadow:none;outline:4px dashed var(--red);outline-offset:2px}
.head:active{transform:scale(.96);box-shadow:none}
.head::after{content:"";position:absolute;inset:-6px;border-radius:50%;border:4px solid var(--red);opacity:0;pointer-events:none}
.head.talk::after{animation:ring .6s ease-out 3}
.panel.talk img{animation:shake .18s ease-in-out 6}
.tip{font-family:var(--display);font-size:26px;letter-spacing:1px}
footer{font-size:15px;color:var(--soft)}
.setup{display:flex;flex-direction:column;gap:24px}
.setup h2{margin:0;font-family:var(--display);font-weight:400;font-size:clamp(40px,6vw,64px);letter-spacing:2px;line-height:1}
.setup .lead{margin:0;max-width:60ch}
.rows{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px}
.row{background:var(--panel);border:5px solid var(--ink);box-shadow:6px 6px 0 var(--ink);display:flex;flex-direction:column;min-width:0}
.thumb{display:block;width:100%;aspect-ratio:4/3;object-fit:cover;border-bottom:4px solid var(--ink)}
.rowbody{padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.rowbody h3{margin:0;font-family:var(--display);font-weight:400;font-size:30px;letter-spacing:1px}
.check{display:flex;align-items:center;gap:10px;font-weight:700;min-height:44px;cursor:pointer}
.check input{width:26px;height:26px;accent-color:var(--red)}
.btns{display:flex;flex-wrap:wrap;gap:10px}
.sbtn{font-size:22px;padding:6px 14px;box-shadow:4px 4px 0 var(--ink);min-height:44px}
.sbtn.rec-on{background:var(--red);color:var(--onred)}
.sbtn:disabled{opacity:.4;cursor:not-allowed;transform:none;box-shadow:4px 4px 0 var(--ink)}
.file{font-size:15px;display:flex;flex-direction:column;gap:6px}
.file input{font-family:var(--body);font-size:15px;max-width:100%}
.status{margin:0;font-size:15px}
.msg{margin:0;font-weight:700;min-height:1.5em}
.dl a{color:var(--ink);font-weight:700}
.pinbox{background:var(--panel);border:5px solid var(--ink);box-shadow:6px 6px 0 var(--ink);padding:16px;display:flex;flex-direction:column;gap:12px;max-width:640px}
.pinbox h3{margin:0;font-family:var(--display);font-weight:400;font-size:30px;letter-spacing:1px}
.pinrow{display:flex;flex-wrap:wrap;gap:12px}
.pinrow label,.pinform label{display:flex;flex-direction:column;gap:6px;font-weight:700;font-size:16px}
.pinrow input,.pinform input{font-family:var(--display);font-size:32px;letter-spacing:10px;width:9ch;max-width:100%;padding:6px 12px;border:4px solid var(--ink);background:var(--panel);color:var(--ink)}
.tokenl{display:flex;flex-direction:column;gap:6px;font-weight:700;font-size:16px}
.tokenl input{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:16px;padding:8px 10px;border:4px solid var(--ink);background:var(--panel);color:var(--ink);max-width:100%}
.pinform{display:flex;flex-direction:column;gap:16px;background:var(--panel);border:5px solid var(--ink);box-shadow:6px 6px 0 var(--ink);padding:20px;max-width:420px}
@keyframes ring{0%{opacity:.9;transform:scale(.9)}100%{opacity:0;transform:scale(1.35)}}
@keyframes shake{0%,100%{transform:rotate(0)}25%{transform:rotate(-1.5deg)}75%{transform:rotate(1.5deg)}}
@keyframes nudge{0%,100%{transform:translate(0,0)}50%{transform:translate(-3px,-5px)}}
@keyframes pop{0%{transform:scale(.4) rotate(-10deg)}60%{transform:scale(1.06) rotate(2deg)}100%{transform:scale(1) rotate(0)}}
@keyframes wobble{0%,100%{transform:rotate(-2deg)}50%{transform:rotate(2deg) scale(1.03)}}
@keyframes beat{0%,100%{transform:scale(1)}50%{transform:scale(1.15)}}
@media (max-width:900px){.rows{grid-template-columns:minmax(0,1fr)}}
@media (max-width:760px){.strip{grid-template-columns:minmax(0,1fr)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

function ctx(){try{if(!ac){ac=new (window.AudioContext||window.webkitAudioContext)();}if(ac.state==='suspended'){ac.resume();}}catch(e){ac=null;}return ac;}
function tone(f1,f2,start,dur,type,vol){var a=ctx();if(!a)return;var t=a.currentTime+start;var o=a.createOscillator();var g=a.createGain();o.type=type||'sine';o.frequency.setValueAtTime(f1,t);o.frequency.exponentialRampToValueAtTime(f2,t+dur);g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(vol||0.3,t+0.01);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+dur+0.02);}
function smack(start){var a=ctx();if(!a)return;var t=a.currentTime+start;var len=Math.floor(a.sampleRate*0.08);var b=a.createBuffer(1,len,a.sampleRate);var d=b.getChannelData(0);for(var i=0;i<len;i++){d[i]=(Math.random()*2-1)*Math.pow(1-i/len,3);}var s=a.createBufferSource();s.buffer=b;var f=a.createBiquadFilter();f.type='bandpass';f.frequency.value=1800;f.Q.value=2;var g=a.createGain();g.gain.value=0.9;s.connect(f);f.connect(g);g.connect(a.destination);s.start(t);tone(900,250,start,0.09,'sine',0.25);}
function voice(){try{var v=speechSynthesis.getVoices();return v.find(function(x){return /^nl/i.test(x.lang);})||null;}catch(e){return null;}}
function speak(i,done){
  var finished=false;function fin(){if(finished)return;finished=true;if(done)done();}
  setTimeout(fin,900+LINES[i].length*95);
  try{if(!('speechSynthesis' in window)){fin();return;}speechSynthesis.cancel();var u=new SpeechSynthesisUtterance(LINES[i]);u.lang='nl-NL';var v=voice();if(v)u.voice=v;u.rate=0.95;u.pitch=1.3;u.onend=fin;u.onerror=fin;speechSynthesis.speak(u);}catch(e){fin();}
}
function startSound(i,done){
  if(i===1){speak(i,function(){smack(0);smack(0.22);setTimeout(done,450);});return;}
  if(i===0){tone(660,660,0,0.08,'square',0.12);tone(880,880,0.12,0.08,'square',0.12);setTimeout(function(){speak(i,done);},250);return;}
  tone(300,700,0,0.35,'sine',0.25);setTimeout(function(){speak(i,done);},380);
}
function play(i){
  ctx();
  var src=state.rec[i],au=null;
  if(src){try{au=new Audio(src);au.muted=true;var p=au.play();if(p&&p.then){p.then(function(){if(!au.dataset.go){au.pause();au.currentTime=0;}}).catch(function(){});}}catch(e){au=null;}}
  function playRec(){if(!au)return;au.dataset.go='1';try{au.pause();au.currentTime=0;}catch(e){}au.muted=false;var q=au.play();if(q&&q.catch)q.catch(function(){});}
  if(state.start[i]){startSound(i,playRec);}else{playRec();}
}
function stopAll(){try{speechSynthesis.cancel();}catch(e){}}

/* ---------- strip view ---------- */
function logo(){return '<h1 class="logo" id="logo" aria-label="Pristrip!"><span class="k">Pri</span><span class="k s1">s</span><span class="r s2">s</span><span class="r">trip</span><span class="k">!</span><span class="hold" aria-hidden="true"></span></h1>';}
function renderStrip(){
  stopAll();
  var panels='';
  for(var i=0;i<3;i++){
    panels+='<figure class="panel '+(i?'locked':'show tapme')+'"><img src="'+IMG[i]+'" alt="'+ALTS[i]+'" width="800" height="600"><button type="button" class="head" aria-label="Speel geluid af: '+ALTS[i]+'"></button><span class="num">'+(i+1)+'</span>'+(i===2?'<span class="next">Wordt vervolgd…</span>':'')+'</figure>';
  }
  app.innerHTML='<header>'+logo()+'<p class="intro">Een strip in drie plaatjes. Tik op het plaatje, dan komt het volgende!</p></header>'+
    '<section class="strip" id="strip" aria-label="Stripverhaal Pristrip">'+panels+'</section>'+
    '<div class="bar"><button type="button" id="again">Nog een keer!</button><span class="tip">Tik op het plaatje!</span></div>'+
    '<footer>Zet je geluid aan. Met de knop begin je weer bij plaatje 1.</footer>';
  var all=app.querySelectorAll('.panel');
  all.forEach(function(panel,idx){panel.addEventListener('click',function(){
    if(panel.classList.contains('locked'))return;
    var b=panel.querySelector('.head');
    panel.classList.remove('tapme');
    b.classList.remove('talk');panel.classList.remove('talk');void b.offsetWidth;b.classList.add('talk');panel.classList.add('talk');
    setTimeout(function(){b.classList.remove('talk');panel.classList.remove('talk');},1900);
    play(idx);
    var nx=all[idx+1];
    if(nx&&nx.classList.contains('locked')){setTimeout(function(){nx.classList.remove('locked');nx.classList.add('show','tapme');},idx===1?1800:1200);}
  });});
  document.getElementById('again').addEventListener('click',renderStrip);
  bindLogo(document.getElementById('logo'),null);
}

/* ---------- code gate ---------- */
var fails=0,lockUntil=0;
function hashPin(code){try{var d=new TextEncoder().encode('pristrip:'+code);return crypto.subtle.digest('SHA-256',d).then(function(b){return Array.prototype.map.call(new Uint8Array(b),function(x){return ('0'+x.toString(16)).slice(-2);}).join('');}).catch(function(){return null;});}catch(e){return Promise.resolve(null);}}
function openSetup(){if(state.pin){renderPin('setup');}else{renderSetup();}}
function openStart(){ready.then(function(){if(state.startPin){renderPin('start');}else{renderStrip();}});}
function bindLogo(lg,onTap){
  var t=null,t0=0;
  function cancel(){clearTimeout(t);t=null;lg.classList.remove('holding');}
  lg.addEventListener('pointerdown',function(){cancel();t0=Date.now();void lg.offsetWidth;lg.classList.add('holding');t=setTimeout(function(){cancel();t0=0;openSetup();},10000);});
  lg.addEventListener('pointerup',function(){var tap=t0&&Date.now()-t0<800;cancel();t0=0;if(tap&&onTap)onTap();});
  ['pointercancel','pointerleave'].forEach(function(ev){lg.addEventListener(ev,function(){cancel();t0=0;});});
  lg.addEventListener('contextmenu',function(e){e.preventDefault();});
  if(onTap){lg.addEventListener('keydown',function(e){if(e.key==='Enter'||e.key===' '){e.preventDefault();onTap();}});}
}
function renderStart(){
  stopAll();
  app.innerHTML='<section class="start" aria-label="Start">'+logo()+'</section>';
  var lg=document.getElementById('logo');
  lg.setAttribute('role','button');lg.setAttribute('tabindex','0');lg.setAttribute('aria-label','Pristrip! Tik om te starten');
  bindLogo(lg,openStart);
}
function renderPin(kind){
  var isStart=kind==='start';
  stopAll();
  app.innerHTML='<section class="setup pinpage" aria-labelledby="pin-title"><h2 id="pin-title">'+(isStart?'Startcode':'Code invoeren')+'</h2>'+
    '<form id="pin-form" class="pinform"><label for="pin-in">'+(isStart?'Startcode':'Toegangscode')+' (6 cijfers)</label>'+
    '<input type="password" id="pin-in" inputmode="numeric" pattern="[0-9]*" maxlength="6" autocomplete="off">'+
    '<div class="bar"><button type="submit">'+(isStart?'Starten':'Openen')+'</button><button type="button" id="pin-back">Terug</button></div></form>'+
    '<p class="msg" id="msg" role="status"></p></section>';
  var inp=document.getElementById('pin-in');inp.focus();
  document.getElementById('pin-back').addEventListener('click',renderStart);
  document.getElementById('pin-form').addEventListener('submit',function(e){
    e.preventDefault();
    var now=Date.now();
    if(now<lockUntil){setMsg('Te vaak fout. Probeer het over '+Math.ceil((lockUntil-now)/1000)+' seconden opnieuw.');return;}
    var v=inp.value;
    if(!/^\d{6}$/.test(v)){setMsg('Vul 6 cijfers in.');return;}
    hashPin(v).then(function(h){
      if(h&&h===(isStart?state.startPin:state.pin)){fails=0;msgText='';if(isStart){renderStrip();}else{renderSetup();}return;}
      fails++;inp.value='';
      if(fails>=5){fails=0;lockUntil=Date.now()+30000;setMsg('Te vaak fout. Wacht 30 seconden.');}
      else{setMsg('Verkeerde code.');}
    });
  });
}

/* ---------- setup view ---------- */
var draft=null,mr=null,recIdx=-1,recTimer=null,msgText='',dlUrl=null;
function toData(blob,cb){var r=new FileReader();r.onload=function(){cb(r.result);};r.onerror=function(){setMsg('Het geluid kon niet worden gelezen.');};r.readAsDataURL(blob);}
function setMsg(s){msgText=s;var m=document.getElementById('msg');if(m)m.textContent=s;}
function renderSetup(){
  stopAll();
  if(!draft)draft={start:state.start.slice(),rec:state.rec.slice(),pin:state.pin,startPin:state.startPin};
  var rows='';
  for(var i=0;i<3;i++){
    var on=recIdx===i,has=!!draft.rec[i];
    rows+='<div class="row"><img class="thumb" src="'+IMG[i]+'" alt="">'+
      '<div class="rowbody"><h3>Plaatje '+(i+1)+'</h3>'+
      '<label class="check" for="start-'+i+'"><input type="checkbox" id="start-'+i+'" data-i="'+i+'"'+(draft.start[i]?' checked':'')+'> Startgeluid aan</label>'+
      '<div class="btns">'+
        '<button type="button" class="sbtn'+(on?' rec-on':'')+'" data-act="rec" data-i="'+i+'"'+(recIdx>-1&&!on?' disabled':'')+'>'+(on?'Stop opname':'Opnemen')+'</button>'+
        '<button type="button" class="sbtn" data-act="play" data-i="'+i+'"'+(has?'':' disabled')+'>Beluister</button>'+
        '<button type="button" class="sbtn" data-act="del" data-i="'+i+'"'+(has?'':' disabled')+'>Wissen</button>'+
      '</div>'+
      '<label class="file" for="file-'+i+'">Of kies een geluidsbestand<input type="file" id="file-'+i+'" data-i="'+i+'" accept="audio/*"></label>'+
      '<p class="status">'+(on?'Bezig met opnemen… (max. 10 sec)':(has?'Eigen geluid: klaar':'Eigen geluid: nog geen'))+'</p>'+
      '</div></div>';
  }
  app.innerHTML='<section class="setup" aria-labelledby="setup-title">'+
    '<h2 id="setup-title">Instellingen</h2>'+
    '<p class="lead">Neem per plaatje een eigen geluid op. Dat speelt af na het startgeluid. Zet het vinkje uit als je alleen je eigen geluid wilt horen.</p>'+
    '<div class="rows">'+rows+'</div>'+
    '<div class="pinbox"><h3>Startcode</h3>'+
      '<p class="status">'+(draft.startPin?'Er is een startcode ingesteld. Na het tikken op het logo moet iedereen die invullen.':'Nog geen startcode. Tikken op het logo start de strip meteen.')+'</p>'+
      '<div class="pinrow"><label for="sc-new">Nieuwe startcode (6 cijfers)<input type="password" id="sc-new" inputmode="numeric" pattern="[0-9]*" maxlength="6" autocomplete="off"></label>'+
      '<label for="sc-again">Herhaal startcode<input type="password" id="sc-again" inputmode="numeric" pattern="[0-9]*" maxlength="6" autocomplete="off"></label></div>'+
      '<div class="btns"><button type="button" class="sbtn" id="sc-set">Startcode instellen</button>'+(draft.startPin?'<button type="button" class="sbtn" id="sc-clear">Startcode verwijderen</button>':'')+'</div></div>'+
    '<div class="pinbox"><h3>Toegangscode</h3>'+
      '<p class="status">'+(draft.pin?'Er is een code ingesteld. De instellingen openen pas na het invoeren van de code.':'Nog geen code. Iedereen die het logo 10 seconden indrukt, komt hier.')+'</p>'+
      '<div class="pinrow"><label for="pin-new">Nieuwe code (6 cijfers)<input type="password" id="pin-new" inputmode="numeric" pattern="[0-9]*" maxlength="6" autocomplete="off"></label>'+
      '<label for="pin-again">Herhaal code<input type="password" id="pin-again" inputmode="numeric" pattern="[0-9]*" maxlength="6" autocomplete="off"></label></div>'+
      '<div class="btns"><button type="button" class="sbtn" id="pin-set">Code instellen</button>'+(draft.pin?'<button type="button" class="sbtn" id="pin-clear">Code verwijderen</button>':'')+'</div></div>'+
    '<div class="bar"><button type="button" id="save">Opslaan</button><button type="button" id="back">Terug</button></div>'+
    '<p class="msg" id="msg" role="status">'+msgText+'</p>'+
    (standalone?'<div class="pinbox"><h3>GitHub-sleutel</h3>'+
      '<p class="status">'+(getToken()?'Op dit toestel is een sleutel bewaard. Opslaan zet je geluiden, vinkjes en code centraal op GitHub.':'Zonder sleutel kan niemand de centrale versie veranderen. Plak hier je GitHub-sleutel om te kunnen opslaan.')+'</p>'+
      '<label class="tokenl" for="token">Sleutel (begint met github_pat_)<input type="password" id="token" autocomplete="off" spellcheck="false" placeholder="'+(getToken()?'bewaard':'github_pat_…')+'"></label>'+
      '<div class="btns"><button type="button" class="sbtn" id="token-set">Sleutel bewaren</button>'+(getToken()?'<button type="button" class="sbtn" id="token-clear">Sleutel wissen</button>':'')+'</div></div>':'')+
    '</section>';
  app.querySelectorAll('.check input').forEach(function(c){c.addEventListener('change',function(){draft.start[+c.dataset.i]=c.checked;});});
  app.querySelectorAll('.file input').forEach(function(f){f.addEventListener('change',function(){
    var file=f.files&&f.files[0],i=+f.dataset.i;if(!file)return;
    if(file.size>3*1024*1024){setMsg('Dit bestand is te groot. Kies een geluid kleiner dan 3 MB.');return;}
    toData(file,function(u){draft.rec[i]=u;msgText='Geluid '+(i+1)+' is gekozen. Vergeet niet op te slaan.';renderSetup();});
  });});
  app.querySelectorAll('.sbtn').forEach(function(b){b.addEventListener('click',function(){
    var i=+b.dataset.i,act=b.dataset.act;
    if(act==='rec'){if(recIdx===i){stopRec();}else{startRec(i);}}
    if(act==='play'&&draft.rec[i]){try{var a=new Audio(draft.rec[i]);var p=a.play();if(p&&p.catch)p.catch(function(){setMsg('Afspelen lukt niet met dit geluid.');});}catch(e){}}
    if(act==='del'){draft.rec[i]=null;msgText='Geluid '+(i+1)+' is gewist. Vergeet niet op te slaan.';renderSetup();}
  });});
  document.getElementById('pin-set').addEventListener('click',function(){
    var a=document.getElementById('pin-new').value,b=document.getElementById('pin-again').value;
    if(!/^\d{6}$/.test(a)){setMsg('De code moet precies 6 cijfers zijn.');return;}
    if(a!==b){setMsg('De twee codes zijn niet hetzelfde.');return;}
    hashPin(a).then(function(h){if(!h){setMsg('Een code instellen lukt niet in deze browser.');return;}draft.pin=h;msgText='Nieuwe code ingesteld. Vergeet niet op te slaan.';renderSetup();});
  });
  var pc=document.getElementById('pin-clear');
  if(pc)pc.addEventListener('click',function(){draft.pin=null;msgText='Code verwijderd. Vergeet niet op te slaan.';renderSetup();});
  document.getElementById('sc-set').addEventListener('click',function(){
    var a=document.getElementById('sc-new').value,b=document.getElementById('sc-again').value;
    if(!/^\d{6}$/.test(a)){setMsg('De startcode moet precies 6 cijfers zijn.');return;}
    if(a!==b){setMsg('De twee startcodes zijn niet hetzelfde.');return;}
    hashPin(a).then(function(h){if(!h){setMsg('Een code instellen lukt niet in deze browser.');return;}draft.startPin=h;msgText='Nieuwe startcode ingesteld. Vergeet niet op te slaan.';renderSetup();});
  });
  var scc=document.getElementById('sc-clear');
  if(scc)scc.addEventListener('click',function(){draft.startPin=null;msgText='Startcode verwijderd. Vergeet niet op te slaan.';renderSetup();});
  var ts=document.getElementById('token-set');
  if(ts)ts.addEventListener('click',function(){var v=document.getElementById('token').value.trim();if(!v){setMsg('Plak eerst je sleutel in het vak.');return;}msgText=setToken(v)?'Sleutel bewaard op dit toestel.':'Bewaren lukt niet in deze browser.';renderSetup();});
  var tc=document.getElementById('token-clear');
  if(tc)tc.addEventListener('click',function(){setToken('');msgText='Sleutel gewist van dit toestel.';renderSetup();});
  document.getElementById('save').addEventListener('click',save);
  document.getElementById('back').addEventListener('click',function(){stopRec();draft=null;msgText='';renderStart();});
}
function startRec(i){
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia||!window.MediaRecorder){setMsg('Opnemen lukt hier niet. Kies een geluidsbestand.');return;}
  navigator.mediaDevices.getUserMedia({audio:true}).then(function(stream){
    var chunks=[];recIdx=i;
    mr=new MediaRecorder(stream);
    mr.ondataavailable=function(e){if(e.data&&e.data.size)chunks.push(e.data);};
    mr.onstop=function(){
      stream.getTracks().forEach(function(t){t.stop();});
      var blob=new Blob(chunks,{type:mr.mimeType||'audio/mp4'});mr=null;recIdx=-1;
      toData(blob,function(u){draft.rec[i]=u;msgText='Opname '+(i+1)+' is klaar. Vergeet niet op te slaan.';renderSetup();});
    };
    mr.start();recTimer=setTimeout(stopRec,10000);msgText='';renderSetup();
  }).catch(function(){setMsg('De microfoon is niet beschikbaar. Kies een geluidsbestand.');});
}
function stopRec(){clearTimeout(recTimer);if(mr&&mr.state!=='inactive'){mr.stop();}}
function buildDoc(){
  var data=JSON.stringify(state).replace(/</g,'\\u003c');
  return '<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>'+RESET+'</style></head><body>'+
    '<title>Pristrip!</title>\n<link rel="stylesheet" href="'+FONT+'">\n<style id="css">'+CSS+'</style>\n<main class="wrap" id="app"></main>\n'+
    '<script type="application/json" id="img">'+IMGSRC+'<\/script>\n<script type="application/json" id="data">'+data+'<\/script>\n<script id="main">'+MAIN+'<\/script>\n</body></html>';
}
function save(){
  if(recIdx>-1){setMsg('Stop eerst de opname.');return;}
  state={start:draft.start.slice(),rec:draft.rec.slice(),pin:draft.pin||null,startPin:draft.startPin||null};
  if(standalone){
    saveCentral();
    return;
  }
  setMsg('Bezig met opslaan…');
  window.claude.use('artifact').then(function(a){
    if(!a){setMsg('Alleen de eigenaar van deze pagina kan opslaan. Je wijzigingen gelden nu alleen hier.');return;}
    return a.publish(buildDoc()).then(function(){setMsg('Opgeslagen!');});
  }).catch(function(e){setMsg(e&&e.code==='conflict'?'Iemand anders sloeg net iets op. Probeer het opnieuw.':'Opslaan is niet gelukt. Probeer het nog eens.');});
}

try{speechSynthesis.getVoices();}catch(e){}
/* ---------- central storage on GitHub ---------- */
function toB64(str){var bytes=new TextEncoder().encode(str),bin='',CH=0x8000;for(var i=0;i<bytes.length;i+=CH){bin+=String.fromCharCode.apply(null,bytes.subarray(i,i+CH));}return btoa(bin);}
function api(path,opts){var t=getToken();opts=opts||{};opts.headers={'Accept':'application/vnd.github+json','Authorization':'Bearer '+t,'X-GitHub-Api-Version':'2022-11-28'};return fetch('https://api.github.com/repos/'+OWNER+'/'+REPO+'/contents/'+path,opts);}
function saveCentral(){
  if(!getToken()){setMsg('Bewaar eerst je GitHub-sleutel, dan kun je centraal opslaan.');return;}
  setMsg('Bezig met opslaan op GitHub…');
  api('data.json?ref=main',{method:'GET',cache:'no-store'}).then(function(r){
    if(r.status===404)return null;
    if(r.status===401)throw {code:401};
    if(!r.ok)throw {code:r.status};
    return r.json().then(function(j){return j.sha;});
  }).then(function(sha){
    var body={message:'Pristrip instellingen bijgewerkt',content:toB64(JSON.stringify(state)),branch:'main'};
    if(sha)body.sha=sha;
    return api('data.json',{method:'PUT',body:JSON.stringify(body)});
  }).then(function(r){
    if(r.ok){setMsg('Opgeslagen! Over ongeveer een minuut hoort en ziet iedereen het.');return;}
    throw {code:r.status};
  }).catch(function(e){
    var c=e&&e.code;
    if(c===401)setMsg('De sleutel klopt niet of is verlopen. Maak een nieuwe en bewaar die bij GitHub-sleutel.');
    else if(c===403||c===404)setMsg('De sleutel mag niet schrijven in '+REPO+'. Geef hem Contents: Read and write.');
    else if(c===409||c===422)setMsg('Er was net een andere wijziging. Druk nog een keer op Opslaan.');
    else setMsg('Opslaan op GitHub is niet gelukt. Controleer je internet en probeer het opnieuw.');
  });
}
var ready=Promise.resolve();
function loadCentral(){
  ready=fetch('data.json?t='+Date.now(),{cache:'no-store'}).then(function(r){return r.ok?r.json():null;}).then(function(d){
    if(!d)return;
    state={start:(d.start||[true,true,true]).slice(),rec:(d.rec||[null,null,null]).slice(),pin:d.pin||null,startPin:d.startPin||null};
  }).catch(function(){});
}

if(standalone&&/^https?:$/.test(location.protocol)){loadCentral();}
renderStart();
})();
